services:
  - type: web
    name: mrs-portfolio-ai-concierge
    runtime: node
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: GRAVATAR_API_KEY
        sync: false
      - key: GMAIL_USER
        value: mr216873@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_RECIPIENT
        value: mr216873@gmail.com
      - key: ADMIN_SECRET
        generateValue: true
